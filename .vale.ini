# Vale enforces one rule of the style guide and nothing else: no evaluative
# words, no exclamation marks, no emoji (styles/Zim). CI runs it over every
# tracked Markdown file and over the prose of the spec (titles, summaries,
# descriptions), extracted by .github/scripts/oas.py.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Zim
