openapi: "3.1.0"
info:
  title: "Monad Monitor API"
  version: "1.0.0-beta.1"
  description: "Read-only API for Monad validator data. Every reading carries its own timestamp, and every JSON response carries `time`, the moment it was generated. Beta, no SLA. Independent project, not affiliated with the Monad Foundation."
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ZIM.ONE
    url: "https://github.com/zimone91/monad-monitor-api/issues"
servers:
  - url: "https://api.zim.one/v1"
security: []
tags:
  - name: validators
    description: "The validator list and per-validator readings."
  - name: network
    description: "Network-wide readings."
  - name: health
    description: "Service liveness and data freshness."
paths:
  "/validators":
    get:
      operationId: listValidators
      tags:
        - validators
      summary: "List validators"
      description: "All validators this service tracks on the network, ordered by id, as light summaries (at most 500). Validators that have left the consensus set are listed too: entries carry no `status`, and `inConsensus` is `false` for them. Entries carry no observation time of their own: they come from the latest indexer cycle, whose age `GET /health/indexer` reports; `time` is the response time.\n\nCache: `public, max-age=60`. Rate class heavy: 120 requests per minute."
      parameters:
        - "$ref": "#/components/parameters/Network"
      responses:
        "200":
          description: "The validator list."
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            "application/json":
              schema:
