  "/health":
    get:
      operationId: getHealth
      tags:
        - health
      summary: "Service liveness"
      description: "Answers `ok` whenever the API process is running, with build provenance (`gitSha`, `builtAt`). It says nothing about data freshness; `GET /health/indexer` does. `time` is the response time.\n\nCache: `no-store`. Rate class standard: 300 requests per minute."
      responses:
        "200":
          description: "The process is running."
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              examples:
                live:
                  summary: "Live response, captured 2026-09-29T00:03:59Z"
                  description: "curl -sS 'https://api.zim.one/v1/health'; not truncated"
                  value:
                    status: ok
                    service: monad-monitor-api
                    chains:
                      mainnet: 143
                      testnet: 10143
                    time: "2026-09-29T00:03:59.777Z"
                    gitSha: "3297b7b"
                    builtAt: "2026-09-28T23:57:07Z"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/health/indexer":
    get:
      operationId: getIndexerHealth
      tags:
