      summary: "Data freshness"
      description: "Freshness verdict of the indexer that feeds every reading: `ok`, `degraded` or `down`, with ages in milliseconds measured at `time`. The verdict is in the body with HTTP 200, also when degraded or down.\n\nCache: `no-store`. Rate class standard: 300 requests per minute."
      responses:
        "200":
          description: "The freshness verdict."
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/IndexerHealth"
              examples:
