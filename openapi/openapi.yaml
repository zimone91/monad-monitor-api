  "/validator/{id}/series":
    get:
      operationId: getValidatorSeries
      tags:
        - validators
      summary: "Get a production or reward time series"
      description: "Blocks produced (`metric=production`) or block rewards in wei (`metric=reward`) per hour, UTC day or ISO week, from the block rewards the indexer recorded. There is no separate observation clock: each point is dated by its bucket start `ts`, and data age is reported by `GET /health/indexer`. An unknown validator returns an empty `points` list.\n\nCache: `public, max-age=60`. Rate class heavy: 120 requests per minute."
      parameters:
        - "$ref": "#/components/parameters/ValidatorId"
        - "$ref": "#/components/parameters/Network"
        - name: metric
          in: query
          required: false
          description: "`production`: blocks produced per bucket. `reward`: block rewards per bucket, wei. Any other value is treated as `production`."
          schema:
            type: string
            enum:
              - production
              - reward
            default: production
        - name: bucket
          in: query
          required: false
          description: "Bucket size: `1h` hour, `1d` UTC day, `1w` ISO week starting Monday. Any other value is treated as `1d`."
          schema:
            type: string
            enum:
              - "1h"
              - "1d"
              - "1w"
            default: "1d"
        - name: from
          in: query
          required: false
          description: "Window start: Unix time in milliseconds (digits only) or an ISO 8601 date-time. Default: `to` minus 24 hours (`1h`), 7 days (`1d`) or 84 days (`1w`). For `1d` and `1w` the window is limited to the 90 days before `to`. Accepted range: 1970-01-01T00:00:00.000Z (`0`) through 9999-12-31T23:59:59.999Z (`253402300799999`). An empty, unparseable or out-of-range value returns 400 (`invalid time`)."
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Window end, in the same formats and range as `from`. Default: now. An empty, unparseable or out-of-range value returns 400 (`invalid time`)."
          schema:
            type: string
      responses:
        "200":
          description: "The series."
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidatorSeries"
              examples:
                live:
                  summary: "Live response, captured 2026-09-29T00:03:52Z"
                  description: "curl -sS 'https://api.zim.one/v1/validator/109/series?network=mainnet&metric=production&bucket=1d'; points truncated to 5 of 8"
                  value:
                    metric: production
                    bucket: "1d"
                    from: "2026-09-22T00:03:53.443Z"
                    to: "2026-09-29T00:03:53.443Z"
                    points:
                      - ts: "2026-09-22T00:00:00.000Z"
                        value: "1066"
                      - ts: "2026-09-23T00:00:00.000Z"
                        value: "1038"
                      - ts: "2026-09-24T00:00:00.000Z"
                        value: "1097"
                      - ts: "2026-09-25T00:00:00.000Z"
                        value: "1061"
                      - ts: "2026-09-26T00:00:00.000Z"
                        value: "1098"
                    time: "2026-09-29T00:03:53.479Z"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/validator/{id}/delegators":
