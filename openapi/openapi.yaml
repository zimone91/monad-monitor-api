      summary: "Get one validator"
      description: "Identity, stake, commission, liveness verdict, block production, income, ranks, current epoch, registry identity and location of one validator. Each part has its own clock: `snapshot.ts` (stake, commission, unclaimed rewards), `liveness.updatedAt` (verdict), `lastProduction.ts` (last block); `time` is the response time. The assembled view is cached for 60 seconds and served stale while one refresh runs, never more than 5 minutes after it was assembled. 404 when the validator is not tracked on this network.\n\nCache: `public, max-age=60`. Rate class heavy: 120 requests per minute."
