      summary: "Get the top delegators"
      description: "Largest delegator positions of one validator by stake, read from the chain. `fetchedAt` is the clock of this reading: the enumeration is cached for 10 minutes, and an older result is served while a refresh runs. 404 when the validator is not tracked on this network or the chain lists no such validator. 503 with `Retry-After` when there is no list to give yet: the first reading for this validator takes longer than 10 seconds (it keeps running and fills the cache), too many readings are queued, or the chain reads failed.\n\nCache: `public, max-age=60`. Rate class heavy: 120 requests per minute."
      parameters:
        - "$ref": "#/components/parameters/ValidatorId"
        - "$ref": "#/components/parameters/Network"
        - name: limit
          in: query
          required: false
          description: "Maximum number of positions to return. Values above 50 are treated as 50 and 0 as 1; a non-numeric value uses the default."
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: "The top delegators."
