name: Release

# Tag-triggered release: gate the tag, build the assets and their provenance,
# and hand them to the maintainer, who creates the GitHub release. This
# workflow does not create it: a release created with the workflow's token is
# authored by github-actions[bot], and this repository has one author. The run
# summary carries the two commands that publish it.
#
# Gates: the tag is annotated and signed (GitHub verifies the signature), it
# equals "v" + info.version of openapi/openapi.yaml, the README names exactly
# this tag, and CHANGELOG.md has a dated section for it (the release notes).
# Assets: openapi.yaml, SHA256SUMS, and a SLSA build provenance attestation
# for both (actions/attest-build-provenance), shipped as
# monad-monitor-api-<tag>.intoto.jsonl, the extension OpenSSF Scorecard's
# Signed-Releases check reads as provenance. The attestation is stored with
# GitHub by this run, so it verifies whoever uploads the files. Verify with:
#   gh attestation verify openapi.yaml --repo zimone91/monad-monitor-api
#
# The secret scan is not repeated here: ci.yml runs gitleaks over the full
# history on the same tag push.
on:
  push:
    tags: ["v*"]
  # Rebuild of an EXISTING tag's assets without moving the tag. The workflow
  # comes from the default branch; the tree comes from the tag in inputs.tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, for example v1.0.0-beta.1"
        required: true

permissions:
  contents: read

concurrency:
  # keyed on the tag being built; never cancel a half-published release
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REDOCLY_TELEMETRY: "off"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # the maintainer creates the release, not this token
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation with GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # on dispatch this is the only thing that puts the tag's tree here
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the tag under build
        # inputs reach the shell through env, never as ${{ }} inside run
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          if ! printf '%s' "$tag" | LC_ALL=C grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "refusing to release: '${tag}' is not vMAJOR.MINOR.PATCH[-pre-release]"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install Spectral, Redocly CLI, markdownlint-cli2 (package-lock.json, sha512-verified)
        run: bash .github/scripts/setup-npm-tools.sh

      - name: Gate - the tag is annotated and its signature verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py verify-tag --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Gate - tag == v(info.version), and the README names exactly this tag
        run: python3 .github/scripts/release.py check --tag "$TAG" --spec "$RUNNER_TEMP/build/openapi.json" --readme README.md

      - name: Release notes from the CHANGELOG.md section of this version
        run: python3 .github/scripts/release.py notes --tag "$TAG" --changelog CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Build openapi.yaml + SHA256SUMS
        run: |
          mkdir -p dist
          cp openapi/openapi.yaml dist/openapi.yaml
          (cd dist && sha256sum openapi.yaml > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance for openapi.yaml and SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/openapi.yaml
            dist/SHA256SUMS

      - name: Attach the attestation bundle as JSON Lines
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > "dist/monad-monitor-api-${TAG}.intoto.jsonl"

      - name: Keep the release notes with the assets
        run: cp "$RUNNER_TEMP/notes.md" dist/notes.md

      - name: Upload the assets for the maintainer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: The commands that publish this release (run summary)
        run: |
          pre=""
          case "$TAG" in *-*) pre=" --prerelease" ;; esac
          {
            echo "### Publish ${TAG}"
            echo
            echo "On the maintainer's machine, in an empty directory:"
            echo
            echo '```sh'
            echo "gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --name release-assets --dir dist"
            echo "gh release create ${TAG} --repo ${GITHUB_REPOSITORY} --verify-tag${pre} --title \"Monad Monitor API ${TAG}\" --notes-file dist/notes.md dist/openapi.yaml dist/SHA256SUMS dist/monad-monitor-api-${TAG}.intoto.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
