name: Scorecard

# OpenSSF Scorecard: an outside assessment of this repository's practices.
# publish_results makes the result public (api.scorecard.dev and the README
# badge). Publishing requires this workflow to stay in the shape Scorecard
# accepts: no top-level env or defaults, no workflow-level write permission,
# id-token only in this job, and only approved actions in this job (no run
# steps).
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results with the workflow identity
      contents: read # read the repository under analysis
      actions: read # read the workflow runs Scorecard assesses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
